<!doctype html>
<html>
  <head>
    <title>Movimentações - Gerenciar</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Movimentações - Gerenciar</h1>

    <!-- FORM -->
    <section class="form-section">
      <form id="movForm">
        <input type="hidden" id="idmov" />
        <input type="hidden" id="usuario" value="{{ usuario_id }}" />

        <label for="dt-mov">Data:</label>
        <input id="dt-mov" type="date" required />

        <label for="lote-numero">Número do Lote:</label>
        <input id="lote-numero" type="text" required />

        <label for="produto">Produto:</label>
        <input id="produto" type="text" readonly />
        <input type="hidden" id="idproduto" />
        <input type="hidden" id="categoria" />
        <!-- campo oculto para categoria -->

        <label for="tipo-mov">Tipo:</label>
        <select id="tipo-mov" required>
          <option value="">Selecione...</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label for="qtd-mov">Quantidade:</label>
        <input id="qtd-mov" type="number" min="1" value="1" required />

        <label for="valor-unitario">Valor Unitário:</label>
        <input id="valor-unitario" type="number" step="0.01" />

        <label for="motivo">Motivo:</label>
        <input id="motivo" type="text" />

        <div class="form-bottom">
          <button type="submit">Salvar</button>
          <button type="reset">Cancelar</button>
        </div>
        <!-- mensagens -->
        <div id="alerta"></div>
      </form>
    </section>
    <!-- FILTROS -->
    <section class="filtros-mov">
      <h3>Filtros</h3>
      <div class="filtros-linha">
        <div>
          <label for="filtro-produto">Produto:</label>
          <select id="filtro-produto">
            <option value="">Todos</option>
          </select>
        </div>

        <div>
          <label for="filtro-tipo">Tipo:</label>
          <select id="filtro-tipo">
            <option value="">Todos</option>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>

        <div>
          <label for="filtro-usuario">Usuário:</label>
          <input type="text" id="filtro-usuario" placeholder="Digite o nome" />
        </div>
      </div>
      <div class="filtros-linha">
        <div>
          <label for="filtro-data">Data:</label>
          <input type="date" id="filtro-data" />
        </div>

        <div>
          <label for="buscaMov">Busca rápida:</label>
          <input type="text" id="buscaMov" placeholder="Motivo, categoria..." />
        </div>
      </div>
    </section>

    <!-- TABELA -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Motivo</th>
            <th>Qtde</th>
            <th>Valor Unitário</th>
            <th>Usuário</th>
            <th>Data</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="listaMov"></tbody>
      </table>
    </section>

    <!-- Modal de confirmação -->
    <div id="modal-confirmacao-mov" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <p id="modal-mensagem-mov">
          Tem certeza que deseja excluir esta movimentação?
        </p>
        <div class="modal-botoes">
          <button type="button" id="btn-confirmar-mov" class="btn-excluir">
            Confirmar
          </button>
          <button type="button" id="btn-cancelar-mov" class="btn-editar">
            Cancelar
          </button>
        </div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/movimentacoes.js') }}"></script>
  </body>
</html>
