<!doctype html>
<html>
  <head>
    <title>Relatório de Estoque</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <!-- Tabela -->
    <section class="table-section">
      <h1>Relatório de Estoque</h1>
      <section class="export-section">
        <button
          type="button"
          onclick="window.location.href = '/relatorio/estoque/export/csv'"
        >
          Exportar CSV
        </button>
        <button
          type="button"
          onclick="window.location.href = '/relatorio/estoque/export/pdf'"
        >
          Exportar PDF
        </button>
        <button
          type="button"
          onclick="window.location.href = '/relatorio/estoque/export/xlsx'"
        >
          Exportar Excel
        </button>
      </section>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Estoque mínimo</th>
            <th>Estoque atual</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="listaRelatorio"></tbody>
      </table>
    </section>

    <!-- Gráfico -->
    <div class="grafico">
      <canvas id="graficoEstoque"></canvas>
    </div>
    <!-- Resumo gerencial -->
    <div id="resumo" style="margin-top: 20px; font-weight: bold"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/relatorio_estoque.js') }}"></script>
  </body>
</html>
