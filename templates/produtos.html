<!doctype html>
<html>
  <head>
    <title>Produtos - Gerenciar</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Produtos - Gerenciar</h1>
    <section class="form-section">
      <form id="formProduto">
        <input type="hidden" id="idproduto" />

        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="Nome" />

        <label for="categoria">Categoria:</label>
        <select id="categoria"></select>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" placeholder="Descrição (opcional)"></textarea>

        <label>
          <input id="checkbox" type="checkbox" /> Controle de validade
        </label>

        <label for="qtd-min">Estoque mínimo:</label>
        <input id="qtd-min" type="number" placeholder="(opcional)" />

        <div class="form-bottom">
          <button type="submit">Salvar</button>
          <button type="reset">Cancelar</button>
        </div>
      </form>
      <!-- mensagens -->
      <div id="alerta"></div>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Estoque atual</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="listaProduto"></tbody>
      </table>
    </section>

    <!-- Modal de confirmação -->
    <div
      id="modal-confirmacao-produto"
      class="modal-overlay"
      style="display: none"
    >
      <div class="modal-box">
        <p id="modal-mensagem-produto">
          Tem certeza que deseja excluir este produto?
        </p>
        <div class="modal-botoes">
          <button type="button" id="btn-confirmar-produto" class="btn-excluir">
            Confirmar
          </button>
          <button type="button" id="btn-cancelar-produto" class="btn-editar">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/produtos.js') }}"></script>
  </body>
</html>
