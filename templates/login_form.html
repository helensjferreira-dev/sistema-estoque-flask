<div class="login-container">
  <form id="loginForm" class="login-form">
    <h2>Entrar na Conta</h2>


    <label>Email:</label>
    <input type="email" id="email" name="email" placeholder="E-mail" required />

    <label>Senha:</label>
    <input
      type="password"
      id="senha"
      name="senha"
      placeholder="Sua senha"
      required
    />

    <button type="submit">Entrar</button>
    <!-- mensagens -->
    <div id="alerta"></div>
  </form>
</div>
