<!DOCTYPE html>
<html>
  <head>
    <title>Fornecedor - Gerenciar</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Fornecedor - Gerenciar</h1>
    <section class="form-section">
      <form id="formFornecedor">
        <input type="hidden" id="idfornecedor" />
        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="Nome" />

        <label for="email">E-mail:</label>
        <input id="email" type="email" placeholder="E-mail" />

        <label for="telefone">Telefone:</label>
        <input id="telefone" type="text" placeholder="Telefone" />

        <div class="form-bottom">
          <button type="submit">Salvar</button>
          <button type="reset">Cancelar</button>
        </div>
        <!-- mensagens -->
        <div id="alerta"></div>
      </form>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Fornecedor</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="listaFornecedor"></tbody>
      </table>
    </section>

    <!-- Modal de confirmação -->
    <div
      id="modal-confirmacao-fornecedor"
      class="modal-overlay"
      style="display: none"
    >
      <div class="modal-box">
        <p id="modal-mensagem-fornecedor">
          Tem certeza que deseja excluir este fornecedor?
        </p>
        <div class="modal-botoes">
          <button id="btn-confirmar-fornecedor" class="btn-excluir">
            Confirmar
          </button>
          <button id="btn-cancelar-fornecedor" class="btn-editar">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "/fornecedor/";
      const form = document.getElementById("formFornecedor");
      const nomeInput = document.getElementById("nome");
      const emailInput = document.getElementById("email");
      const telefoneInput = document.getElementById("telefone");
      const tabelaBody = document.getElementById("listaFornecedor");
      let idEditando = null;
      let idFornecedorParaExcluir = null;

      // Mensagens com cores de sucesso/erro
      function exibirMensagem(mensagem, sucesso = false) {
        const alerta = document.getElementById("alerta");
        alerta.innerText = mensagem;
        alerta.style.display = "block";
        alerta.style.backgroundColor = sucesso ? "#d4edda" : "#f8d7da"; // verde ou vermelho
        alerta.style.color = sucesso ? "#155724" : "#721c24";
        alerta.style.border = sucesso
          ? "1px solid #c3e6cb"
          : "1px solid #f5c6cb";

        setTimeout(() => {
          alerta.style.display = "none";
        }, 4000);
      }

      async function carregarFornecedores() {
        const resposta = await fetch(API_URL + "fornecedores");
        const retorno = await resposta.json();
        const fornecedores = retorno.dados;

        tabelaBody.innerHTML = "";

        fornecedores.forEach((fornecedor) => {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>${fornecedor.id}</td>
            <td>${fornecedor.nome}</td>
            <td>${fornecedor.email ?? "-"}</td>
            <td>${fornecedor.telefone ?? "-"}</td>
            <td>
              <button class="btn-editar" onclick="editarFornecedor(${fornecedor.id})">Editar</button>
              <button class="btn-excluir" onclick="mostrarModalFornecedor(${fornecedor.id})">Excluir</button>
            </td>
          `;
          tabelaBody.appendChild(linha);
        });
      }

      form.onsubmit = async (e) => {
        e.preventDefault();

        const nome = nomeInput.value.trim();
        const emailRaw = emailInput.value.trim();
        const telefoneRaw = telefoneInput.value.trim();

        if (!nome) {
          exibirMensagem("O campo 'Nome' é obrigatório.");
          return;
        }
        // se vazio, envia null
        const email = emailRaw === "" ? null : emailRaw;
        const telefone = telefoneRaw === "" ? null : telefoneRaw;
        // Verificação de nome duplicado (apenas no front)
        const respostaFornecedores = await fetch(API_URL + "fornecedores");
        const retornoFornecedores = await respostaFornecedores.json();
        const fornecedoresExistentes = retornoFornecedores.dados || [];

        const nomeJaExiste = fornecedoresExistentes.some(
          (f) =>
            f.nome.toLowerCase() === nome.toLowerCase() && f.id !== idEditando
        );

        if (nomeJaExiste) {
          exibirMensagem("Já existe um fornecedor com este nome.", false);
          return; // interrompe o envio
        }

        const metodo = idEditando ? "PUT" : "POST";
        const url = idEditando
          ? API_URL + "fornecedor"
          : API_URL + "fornecedores";

        const resposta = await fetch(url, {
          method: metodo,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: idEditando, nome, email, telefone }),
        });

        const retorno = await resposta.json();

        // Mensagem verde se sucesso
        exibirMensagem(
          retorno.Mensagem || "Erro ao salvar.",
          retorno.Resultado
        );

        // Limpa os campos
        nomeInput.value = "";
        emailInput.value = "";
        telefoneInput.value = "";
        idEditando = null;

        carregarFornecedores();
      };

      async function editarFornecedor(id) {
        const resposta = await fetch(API_URL + "fornecedor/" + id);
        const retorno = await resposta.json();
        const fornecedor = retorno.dados;

        if (fornecedor) {
          idEditando = fornecedor.id;
          nomeInput.value = fornecedor.nome;
          emailInput.value = fornecedor.email;
          telefoneInput.value = fornecedor.telefone;
          // foco no primeiro campo editável
          nomeInput.focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      // Modal de confirmação
      function mostrarModalFornecedor(id) {
        idFornecedorParaExcluir = id;
        document.getElementById("modal-confirmacao-fornecedor").style.display =
          "flex";
      }

      document.getElementById("btn-confirmar-fornecedor").onclick =
        async () => {
          if (idFornecedorParaExcluir !== null) {
            const resposta = await fetch(
              API_URL + "fornecedor/" + idFornecedorParaExcluir,
              {
                method: "DELETE",
              }
            );
            const retorno = await resposta.json();
            exibirMensagem(
              retorno.Mensagem || "Erro ao excluir.",
              retorno.Resultado
            );
            carregarFornecedores();
            idFornecedorParaExcluir = null;
          }
          document.getElementById(
            "modal-confirmacao-fornecedor"
          ).style.display = "none";
        };

      document.getElementById("btn-cancelar-fornecedor").onclick = () => {
        idFornecedorParaExcluir = null;
        document.getElementById("modal-confirmacao-fornecedor").style.display =
          "none";
      };

      form.onreset = (e) => {
        e.preventDefault();
        idEditando = null;
        nomeInput.value = "";
        emailInput.value = "";
        telefoneInput.value = "";
        carregarFornecedores();
      };

      carregarFornecedores();
    </script>
  </body>
</html>
