<!doctype html>
<html>
  <head>
    <title>Fornecedor - Gerenciar</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Fornecedor - Gerenciar</h1>
    <section class="form-section">
      <form id="formFornecedor">
        <input type="hidden" id="idfornecedor" />
        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="Nome" />

        <label for="email">E-mail:</label>
        <input id="email" type="email" placeholder="E-mail" />

        <label for="telefone">Telefone:</label>
        <input id="telefone" type="text" placeholder="Telefone" />

        <div class="form-bottom">
          <button type="submit">Salvar</button>
          <button type="reset">Cancelar</button>
        </div>
        <!-- mensagens -->
        <div id="alerta"></div>
      </form>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Fornecedor</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="listaFornecedor"></tbody>
      </table>
    </section>

    <!-- Modal de confirmação -->
    <div
      id="modal-confirmacao-fornecedor"
      class="modal-overlay"
      style="display: none"
    >
      <div class="modal-box">
        <p id="modal-mensagem-fornecedor">
          Tem certeza que deseja excluir este fornecedor?
        </p>
        <div class="modal-botoes">
          <button
            type="button"
            id="btn-confirmar-fornecedor"
            class="btn-excluir"
          >
            Confirmar
          </button>
          <button type="button" id="btn-cancelar-fornecedor" class="btn-editar">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fornecedores.js') }}"></script>
  </body>
</html>
