<!doctype html>
<html>
  <head>
    <title>Relatório de Validade</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Relatório de Validade</h1>

    <!-- Botões de exportação -->
    <section class="export-section">
      <button
        type="button"
        onclick="window.location.href = '/relatorio/validade/export/csv'"
      >
        Exportar CSV
      </button>
      <button
        type="button"
        onclick="window.location.href = '/relatorio/validade/export/pdf'"
      >
        Exportar PDF
      </button>
      <button
        type="button"
        onclick="window.location.href = '/relatorio/validade/export/xlsx'"
      >
        Exportar Excel
      </button>
    </section>

    <!-- Tabela -->
    <section class="table-section">
      <h2>Lotes próximos do vencimento</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Lote</th>
            <th>Quantidade</th>
            <th>Validade</th>
            <th>Dias restantes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="listaValidade"></tbody>
      </table>
    </section>

    <!-- Gráfico -->
    <div class="grafico">
      <canvas id="graficoValidade"></canvas>
    </div>

    <!-- Resumo gerencial -->
    <div id="resumoValidade"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/relatorio_validade.js') }}"></script>
  </body>
</html>
