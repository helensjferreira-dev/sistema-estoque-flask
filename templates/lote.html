<!DOCTYPE html>
<html>
  <head>
    <title>Lote - Gerenciar</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    {% include 'menu_app.html' %}

    <h1>Lote - Gerenciar</h1>

    <!-- FORM -->
    <section class="form-section">
      <form id="loteForm">
        <input type="hidden" id="idlote" />

        <label for="idproduto">Produto:</label>
        <select id="idproduto" required></select>

        <label for="idfornecedor">Fornecedor:</label>
        <select id="idfornecedor" required></select>

        <label for="numero">Número do Lote:</label>
        <input id="numero" type="text" required />

        <label for="data-cadastro">Data de Cadastro:</label>
        <input id="data-cadastro" type="date" required />

        <label for="data-validade">Data de Validade:</label>
        <input id="data-validade" type="date" required />

        <label for="quantidade">Quantidade:</label>
        <input id="quantidade" type="number" min="1" required />

        <div class="form-bottom">
          <button type="submit">Salvar</button>
          <button type="reset">Cancelar</button>
        </div>
        <!-- mensagens -->
        <div id="alerta"></div>
      </form>
    </section>
    <section class="resumo-lotes">
      <p id="contador-vencidos">Lotes vencidos: 0</p>
      <p id="contador-alerta">Lotes próximos do vencimento: 0</p>
    </section>

    <section class="filtros-lotes">
      <h3>Filtros</h3>
      <div class="filtros-linha">
        <div>
          <label for="filtro-produto">Produto:</label>
          <select id="filtro-produto">
            <option value="">Todos</option>
          </select>
        </div>

        <div>
          <label for="filtro-fornecedor">Fornecedor:</label>
          <select id="filtro-fornecedor">
            <option value="">Todos</option>
          </select>
        </div>

        <div>
          <label for="filtro-validade">Validade:</label>
          <select id="filtro-validade">
            <option value="">Todas</option>
            <option value="vencido">Vencidos</option>
            <option value="alerta">Próximos (≤30 dias)</option>
            <option value="ok">Válidos</option>
          </select>
        </div>
      </div>
      <div class="filtros-linha">
        <div>
          <label for="filtro-quantidade">Quantidade menor que:</label>
          <input
            type="number"
            id="filtro-quantidade"
            min="1"
            placeholder="Ex: 10"
          />
        </div>

        <div>
          <label for="buscaLote">Busca rápida:</label>
          <input
            type="text"
            id="buscaLote"
            placeholder="Digite lote, produto ou fornecedor..."
          />
        </div>
      </div>
    </section>

    <!-- TABELA -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Número</th>
            <th>Produto</th>
            <th>Fornecedor</th>
            <th>Quantidade</th>
            <th>Validade</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="listaLote"></tbody>
      </table>
    </section>

    <!-- Modal de confirmação -->
    <div
      id="modal-confirmacao-lote"
      class="modal-overlay"
      style="display: none"
    >
      <div class="modal-box">
        <p id="modal-mensagem-lote">
          Tem certeza que deseja excluir este lote?
        </p>
        <div class="modal-botoes">
          <button id="btn-confirmar-lote" class="btn-excluir">Confirmar</button>
          <button id="btn-cancelar-lote" class="btn-editar">Cancelar</button>
        </div>
      </div>
    </div>
    <!-- Defina o ID do usuário aqui -->
    <script>
      const ID_USUARIO = {{ session.get('idusuario') }};
    </script>

    <script>
      const API_URL = "/lote/";
      const form = document.getElementById("loteForm");
      const alerta = document.getElementById("alerta");
      const tabelaBody = document.getElementById("listaLote");
      let idLoteParaExcluir = null;

      function exibirMensagem(msg, sucesso = false) {
        alerta.textContent = msg;
        alerta.style.display = "block";
        alerta.style.backgroundColor = sucesso ? "#d4edda" : "#f8d7da";
        alerta.style.color = sucesso ? "#155724" : "#721c24";
        alerta.style.border = sucesso
          ? "1px solid #c3e6cb"
          : "1px solid #f5c6cb";

        setTimeout(() => (alerta.style.display = "none"), 3000);
      }
      function verificarValidade(dataISO) {
        if (!dataISO) return { texto: "-", classe: "" };
        const hoje = new Date();
        const validade = new Date(dataISO);
        const diffDias = (validade - hoje) / (1000 * 60 * 60 * 24);

        if (diffDias < 0) {
          return { texto: formatarDataISO(dataISO), classe: "vencido" }; // já venceu
        } else if (diffDias <= 30) {
          return { texto: formatarDataISO(dataISO), classe: "alerta" }; // vence em até 30 dias
        }
        return { texto: formatarDataISO(dataISO), classe: "" }; // ok
      }
      function formatarDataISO(dataISO) {
        if (!dataISO) return "-";
        const partes = dataISO.split("-");
        if (partes.length !== 3) return dataISO; // se não vier no formato esperado
        return `${partes[2]}/${partes[1]}/${partes[0]}`; // dd/mm/yyyy
      }

      /* ----------------------------- CARREGAR PRODUTOS ------------------------------ */
      async function carregarProdutos() {
        const resp = await fetch("/produto/produtos");
        const dados = await resp.json();
        const combo = document.getElementById("idproduto");
        combo.innerHTML = `<option value="">Selecione...</option>`;
        dados.dados?.forEach((p) => {
          combo.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
        });
      }

      /* --------------------------- CARREGAR FORNECEDORES ---------------------------- */
      async function carregarFornecedores() {
        const resp = await fetch("/fornecedor/fornecedores");
        const dados = await resp.json();
        const combo = document.getElementById("idfornecedor");
        combo.innerHTML = `<option value="">Selecione...</option>`;
        dados.dados?.forEach((f) => {
          combo.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
        });
      }

      /* ------------------------------ CARREGAR LOTES -------------------------------- */
      async function carregarLotes() {
        const resp = await fetch(API_URL + "lotes");
        const dados = await resp.json();
        tabelaBody.innerHTML = "";
        let vencidos = 0;
        let alertaCount = 0;
        dados.dados?.forEach((l) => {
          // Verifica validade e aplica estilo
          const validadeInfo = verificarValidade(l.data_validade);
          if (l.quantidade > 0) {
            if (validadeInfo.classe === "vencido") vencidos++;
            if (validadeInfo.classe === "alerta") alertaCount++;
          }

          tabelaBody.innerHTML += `
      <tr data-produto="${l.idproduto}" data-fornecedor="${l.idfornecedor}">
              <td>${l.id}</td>
              <td>${l.numero}</td>
              <td>${l.produto?.nome ?? "-"}</td>
              <td>${l.fornecedor?.nome ?? "-"}</td>
              <td>${l.quantidade}</td>
              <td class="${validadeInfo.classe}">${validadeInfo.texto}</td>

              <td>
                <button class="btn-editar" onclick="editarLote(${
                  l.id
                })">Editar</button>
                <button class="btn-excluir" onclick="mostrarModalLote(${
                  l.id
                })">Excluir</button>
              </td>
            </tr>`;
        });
        // Atualiza os contadores no topo
        document.getElementById(
          "contador-vencidos"
        ).textContent = `Lotes vencidos: ${vencidos}`;
        document.getElementById(
          "contador-alerta"
        ).textContent = `Lotes próximos do vencimento: ${alertaCount}`;
      }
      function aplicarFiltros() {
        const produto = document.getElementById("filtro-produto").value;
        const fornecedor = document.getElementById("filtro-fornecedor").value;
        const validade = document.getElementById("filtro-validade").value;
        const qtdMax = document.getElementById("filtro-quantidade").value;
        const busca = document.getElementById("buscaLote").value.toLowerCase();

        const linhas = tabelaBody.querySelectorAll("tr");
        linhas.forEach((linha) => {
          const texto = linha.innerText.toLowerCase();
          const cols = linha.querySelectorAll("td");

          const idProdutoLinha = linha.dataset.produto;
          const idFornecedorLinha = linha.dataset.fornecedor;
          const qtdCol = parseInt(cols[4]?.innerText || "0");
          const validadeCol = linha.querySelector("td:nth-child(6)")?.className;

          let visivel = true;

          if (produto && idProdutoLinha !== produto) visivel = false;
          if (fornecedor && idFornecedorLinha !== fornecedor) visivel = false;
          if (validade && validadeCol !== validade) visivel = false;
          if (qtdMax && qtdCol >= qtdMax) visivel = false;
          if (busca && !texto.includes(busca)) visivel = false;

          linha.style.display = visivel ? "" : "none";
        });
      }
      /* ----------------------------- CARREGAR PRODUTOS FILTRO ------------------------------ */
      async function carregarProdutosFiltro() {
        const resp = await fetch("/produto/produtos");
        const dados = await resp.json();
        const combo = document.getElementById("filtro-produto");
        combo.innerHTML = `<option value="">Todos</option>`;
        dados.dados?.forEach((p) => {
          combo.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
        });
      }

      /* --------------------------- CARREGAR FORNECEDORES FILTRO ---------------------------- */
      async function carregarFornecedoresFiltro() {
        const resp = await fetch("/fornecedor/fornecedores");
        const dados = await resp.json();
        const combo = document.getElementById("filtro-fornecedor");
        combo.innerHTML = `<option value="">Todos</option>`;
        dados.dados?.forEach((f) => {
          combo.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
        });
      }

      // Ativa filtros ao mudar qualquer campo
      document
        .querySelectorAll(
          "#filtro-produto, #filtro-fornecedor, #filtro-validade, #filtro-quantidade, #buscaLote"
        )
        .forEach((el) => el.addEventListener("input", aplicarFiltros));

      /* ------------------------------ SALVAR / EDITAR ------------------------------ */
      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("idlote").value;
        const idproduto = document.getElementById("idproduto").value;
        const idfornecedor = document.getElementById("idfornecedor").value;
        const numero = document.getElementById("numero").value;
        const data_cadastro = document.getElementById("data-cadastro").value;
        const data_validade = document.getElementById("data-validade").value;
        const quantidade = document.getElementById("quantidade").value;

        const metodo = id ? "PUT" : "POST";
        const endpoint = id ? "lote" : "lotes";

        const resp = await fetch(API_URL + endpoint, {
          method: metodo,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id,
            idproduto,
            idfornecedor,
            numero,
            data_cadastro,
            data_validade,
            quantidade,
          }),
        });

        const ret = await resp.json();
        exibirMensagem(ret.mensagem || ret.Mensagem, true);
        form.reset();
        document.getElementById("idlote").value = "";
        carregarLotes();
      };

      /* ------------------------------ EDITAR LOTE ------------------------------ */
      async function editarLote(id) {
        const resp = await fetch(API_URL + "lote/" + id);
        const ret = await resp.json();
        const l = ret.dados;
        document.getElementById("idlote").value = l.id;
        document.getElementById("idproduto").value = l.idproduto;
        document.getElementById("idfornecedor").value = l.idfornecedor;
        document.getElementById("numero").value = l.numero;
        document.getElementById("data-cadastro").value = l.data_cadastro;
        document.getElementById("data-validade").value = l.data_validade;
        document.getElementById("quantidade").value = l.quantidade;
        // foco no primeiro campo editável (número do lote)
        document.getElementById("numero").focus();

        // rola a página até o topo
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* ------------------------------ RESET FORM ------------------------------ */
      form.onreset = (e) => {
        form.reset();
        document.getElementById("idlote").value = "";
        carregarProdutos();
        carregarFornecedores();
      };

      /* ------------------------------ INICIALIZANDO ------------------------------ */
      carregarProdutos();
      carregarFornecedores();
      carregarLotes();
      carregarProdutosFiltro();
      carregarFornecedoresFiltro();
      // 🔒 Regras para datas
      const hoje = new Date().toISOString().split("T")[0];

      // Data de Validade: mínimo = hoje (não aceita passado)
      const dataValidadeInput = document.getElementById("data-validade");
      dataValidadeInput.min = hoje;

      // Data de Cadastro: máximo = hoje (não aceita futuro)
      const dataCadastroInput = document.getElementById("data-cadastro");
      dataCadastroInput.max = hoje;

      /* ------------------------------ MODAL EXCLUSÃO ------------------------------ */
      function mostrarModalLote(id) {
        idLoteParaExcluir = id;
        document.getElementById("modal-confirmacao-lote").style.display =
          "flex";
      }

      document.getElementById("btn-confirmar-lote").onclick = async () => {
        if (idLoteParaExcluir !== null) {
          const resp = await fetch(API_URL + "lote/" + idLoteParaExcluir, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              idusuario: ID_USUARIO,
            }),
          });
          const ret = await resp.json();
          exibirMensagem(ret.mensagem || ret.Mensagem);
          carregarLotes();
          idLoteParaExcluir = null;
        }
        document.getElementById("modal-confirmacao-lote").style.display =
          "none";
      };

      document.getElementById("btn-cancelar-lote").onclick = () => {
        idLoteParaExcluir = null;
        document.getElementById("modal-confirmacao-lote").style.display =
          "none";
      };
    </script>
  </body>
</html>
