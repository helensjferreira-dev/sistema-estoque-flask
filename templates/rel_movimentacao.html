<!doctype html>
<html>
  <head>
    <title>Relatório de Movimentações</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Relatório de Movimentações</h1>

    <!-- Botões de exportação -->
    <div class="export-section">
      <button type="button" onclick="exportar('pdf')">Exportar PDF</button>
      <button type="button" onclick="exportar('csv')">Exportar CSV</button>
      <button type="button" onclick="exportar('xlsx')">Exportar Excel</button>
    </div>

    <!-- Filtros -->
    <section class="filtros-mov">
      <div class="filtros-linha">
        <label>Data início:</label>
        <input type="date" id="dataInicio" />
        <label>Data fim:</label>
        <input type="date" id="dataFim" />

        <label>Produto:</label>
        <input type="text" id="filtroProduto" placeholder="Nome do produto" />
      </div>
      <div class="filtros-linha">
        <label>Tipo:</label>
        <select id="filtroTipo">
          <option value="">Todos</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label>Usuário:</label>
        <input type="text" id="filtroUsuario" placeholder="Nome do usuário" />

        <button type="button" onclick="carregarRelatorio()">Filtrar</button>
      </div>
    </section>

    <!-- Tabela -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Data</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
            <th>Motivo</th>
            <th>Usuário</th>
            <th>Lote</th>
            <th>Estoque Lote</th>
          </tr>
        </thead>
        <tbody id="listaMovPeriodo"></tbody>
      </table>
    </section>

    <!-- Resumo -->
    <div id="resumoPeriodo" class="movement-summary"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/relatorio_movimentacoes.js') }}"></script>
  </body>
</html>
