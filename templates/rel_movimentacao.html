<!DOCTYPE html>
<html>
  <head>
    <title>Relatório de Movimentações</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Parisienne&family=Cinzel+Decorative:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Destaques visuais */
      .entrada { color: green; font-weight: bold; }
      .saida { color: red; font-weight: bold; }
      .esgotado { color: gray; font-style: italic; }
    </style>
  </head>
  <body>
    {% include 'menu_app.html' %}

    <h1>Relatório de Movimentações</h1>

    <!-- Botões de exportação -->
    <div class="export-section">
      <button onclick="exportar('pdf')">Exportar PDF</button>
      <button onclick="exportar('csv')">Exportar CSV</button>
      <button onclick="exportar('xlsx')">Exportar Excel</button>
    </div>

    <!-- Filtros -->
    <section class="filtros-mov">
      <div class="filtros-linha">
        <label>Data início:</label>
        <input type="date" id="dataInicio" />
        <label>Data fim:</label>
        <input type="date" id="dataFim" />

        <label>Produto:</label>
        <input type="text" id="filtroProduto" placeholder="Nome do produto" />
      </div>
      <div class="filtros-linha">
        <label>Tipo:</label>
        <select id="filtroTipo">
          <option value="">Todos</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label>Usuário:</label>
        <input type="text" id="filtroUsuario" placeholder="Nome do usuário" />

        <button onclick="carregarRelatorio()">Filtrar</button>
      </div>
    </section>

    <!-- Tabela -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Data</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
            <th>Motivo</th>
            <th>Usuário</th>
            <th>Lote</th>
            <th>Estoque Lote</th>
          </tr>
        </thead>
        <tbody id="listaMovPeriodo"></tbody>
      </table>
    </section>

    <!-- Resumo -->
    <div id="resumoPeriodo" style="margin-top: 20px; font-weight: bold"></div>

    <script>
      function formatarNumero(num) {
        const n = Number(num);
        return Number.isFinite(n) ? n.toLocaleString("pt-BR") : "-";
      }

      function formatarMoeda(valor) {
        const n = Number(valor);
        return Number.isFinite(n)
          ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })
          : "-";
      }

function formatarData(dataStr) {
  if (!dataStr) return "-";
  const d = new Date(dataStr);
  return isNaN(d.getTime())
    ? dataStr
    : d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
}


      function exportar(tipo) {
        const inicio = document.getElementById("dataInicio").value;
        const fim = document.getElementById("dataFim").value;
        const produto = document.getElementById("filtroProduto").value;
        const tipoMov = document.getElementById("filtroTipo").value;
        const usuario = document.getElementById("filtroUsuario").value;

        let url = `/relatorio/movimentacoes/export/${tipo}?data_inicio=${inicio}&data_fim=${fim}&produto=${produto}&tipo=${tipoMov}&usuario=${usuario}`;
        window.open(url, "_blank");
      }

      async function carregarRelatorio() {
        const inicio = document.getElementById("dataInicio").value;
        const fim = document.getElementById("dataFim").value;
        const produto = document.getElementById("filtroProduto").value;
        const tipo = document.getElementById("filtroTipo").value;
        const usuario = document.getElementById("filtroUsuario").value;

        const resp = await fetch(
          `/relatorio/movimentacoes?data_inicio=${inicio}&data_fim=${fim}&produto=${produto}&tipo=${tipo}&usuario=${usuario}`
        );
        const dados = await resp.json();
        const lista = document.getElementById("listaMovPeriodo");
        lista.innerHTML = "";

        let entradas = 0;
        let saidas = 0;
        let valorTotal = 0;

        dados.dados.forEach((m) => {
          const qtd = Number(m.quantidade) || 0;
          const vu = m.valor_unitario != null ? Number(m.valor_unitario) : null;
          const tipo = (m.tipo || "").toLowerCase();

          let tipoClass = tipo === "entrada" ? "entrada" : "saida";
          let statusClass = "";
          if (m.status && m.status.includes("esgotado")) statusClass = "esgotado";

          lista.innerHTML += `
            <tr>
              <td>${m.idmovimentacao}</td>
              <td>${formatarData(m.data_movimentacao)}</td>
              <td>${m.produto}</td>
              <td>${m.categoria}</td>
              <td class="${tipoClass}">${m.tipo}</td>
              <td>${formatarNumero(qtd)}</td>
              <td>${vu != null ? formatarMoeda(vu) : "-"}</td>
              <td>${m.motivo ?? "-"}</td>
              <td>${m.usuario}</td>
              <td>${m.idlote ?? "-"}</td>
              <td>${formatarNumero(m.estoque_lote ?? 0)}</td>
            </tr>
          `;

          if (tipo === "entrada") entradas += qtd;
          if (tipo === "saida") saidas += qtd;
          if (vu != null) valorTotal += vu * qtd;
        });

        document.getElementById("resumoPeriodo").innerHTML = `
          Entradas: ${formatarNumero(entradas)} |
          Saídas: ${formatarNumero(saidas)} |
          Saldo líquido: ${formatarNumero(entradas - saidas)} <br>
          Valor total movimentado: ${formatarMoeda(valorTotal)}
        `;
      }

      window.onload = () => {
        const hoje = new Date();
        const fim = hoje.toISOString().split("T")[0];
        const inicio = new Date(hoje.getTime() - 30 * 24 * 60 * 60 * 1000)
          .toISOString()
          .split("T")[0];
        document.getElementById("dataInicio").value = inicio;
        document.getElementById("dataFim").value = fim;
        carregarRelatorio();
      };
    </script>
  </body>
</html>
